<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmad Iqbal | ahmads.build</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/assets/favicon-light.png" media="(prefers-color-scheme: dark)">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf9f7;
      color: #1a1a1a;
      line-height: 1.6;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      max-width: 960px;
      margin: 0 auto;
    }
    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo img { height: 32px; width: auto; display: block; }
    .nav-links { display: flex; align-items: center; gap: 16px; }
    .nav-links a { color: #1a1a1a; text-decoration: none; font-size: 15px; }
    .nav-links a:hover { text-decoration: underline; }
    .nav-links a.btn {
      background: #1a1a1a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-links a.btn:hover { background: #333; text-decoration: none; }
    main { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
    h1 { font-size: 40px; line-height: 1.2; margin-bottom: 20px; }
    .intro { font-size: 19px; color: #444; margin-bottom: 56px; }
    .cards { display: grid; gap: 16px; }
    .card {
      display: block;
      background: #fff;
      border: 1px solid #e5e2dc;
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: #1a1a1a;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #1a1a1a; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card h2 { font-size: 20px; }
    .card p { color: #555; font-size: 16px; }
    .tag {
      font-size: 12px;
      font-weight: 600;
      background: #f0ede7;
      color: #6b6558;
      padding: 4px 10px;
      border-radius: 999px;
    }
    footer { text-align: center; padding: 40px 24px; color: #888; font-size: 14px; }
    @media (max-width: 520px) {
      h1 { font-size: 30px; }
      .nav-links { gap: 12px; }
      nav { padding: 16px; gap: 12px; }
      .logo img { height: 24px; }
      .nav-links a { font-size: 14px; }
      .nav-links a.btn { padding: 8px 12px; font-size: 14px; white-space: nowrap; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo"><img src="/assets/logo.png" alt="Build 52 by Ahmad Iqbal – home" width="107" height="32"></a>
    <div class="nav-links">
      <a href="/about">About</a>
      <a href="https://www.linkedin.com/in/ahmadiqbal1" target="_blank">LinkedIn</a>
      <a href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ2LftEg_0td3W-pWEFQwLBZ6LC8GmgLlSoYkhCQzig38rFytq_mOt4pI7OCqQhuaOxfuIOIdP54" class="btn">Book office hours</a>
    </div>
  </nav>

  <main>
    <div class="cards">
      <a href="/writing" class="card">
        <div class="card-top"><h2>Writing</h2><span class="tag">Coming soon</span></div>
        <p>Weekly notes on what I'm building and learning.</p>
      </a>
      <a href="/builds" class="card">
        <div class="card-top"><h2>Builds</h2><span class="tag">Coming soon</span></div>
        <p>The agents and apps I've shipped, with demos you can try.</p>
      </a>
      <a href="/resources" class="card">
        <div class="card-top"><h2>Resources</h2><span class="tag">New</span></div>
        <p>Templates and guides to build your own agents.</p>
      </a>
    </div>
  </main>

  <footer>ahmads.build</footer>

</body>
</html>
