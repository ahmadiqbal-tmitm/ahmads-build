<!DOCTYPE html>
<html lang="en" class="is-home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Build 52 | ahmads.build</title>
  <meta name="description" content="From AI happening to you, to AI working for you. Free AI agents to make your life easier. No code needed.">
  <link rel="icon" type="image/png" href="/images/favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/images/favicon-light.png" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/brand.css?v=aa751892">
  <link rel="stylesheet" href="/assets/home.css?v=9f284783">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="banner">
    <span class="banner-tag">One agent a week</span>
    <a class="wordmark" href="/"><img src="/images/logo-light.png" alt="Build 52 by Ahmad Iqbal – home" width="147" height="44"></a>
    <a class="banner-cta" href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ2LftEg_0td3W-pWEFQwLBZ6LC8GmgLlSoYkhCQzig38rFytq_mOt4pI7OCqQhuaOxfuIOIdP54">Book a call</a>
  </header>

  <main class="poster" id="main">
    <div class="scene" role="img" aria-label="A collage: a rotary telephone, a pixel-art owl in blue sunglasses and a pixel-art cheetah in red sunglasses float in a blue sky above red and purple hills.">
      <img class="layer stars" src="/images/scene/stars.webp" alt="" width="1920" height="1080">
      <img class="layer hills" src="/images/scene/hills.webp" alt="" width="1920" height="527">
      <div class="layer hills-shimmer" aria-hidden="true"></div>
      <div class="obj obj-phone" data-link="about"><span class="obj-inner"><img src="/images/scene/phone.webp" alt="" width="900" height="777"></span></div>
      <div class="obj obj-owl" data-link="agents"><span class="obj-inner disc disc-owl"><img src="/images/scene/owl.webp" alt="" width="699" height="687"></span></div>
      <div class="obj obj-cheetah" data-link="tutorials"><span class="obj-inner disc disc-cheetah"><img src="/images/scene/cheetah.webp" alt="" width="609" height="675"></span></div>
    </div>

    <nav class="poster-nav" aria-label="Main">
      <a class="pill pill-writing" href="/writing/">Writing</a>
      <a class="pill pill-agents" href="/agents/">Agents</a>
      <a class="pill pill-tutorials" href="/resources/">Tutorials</a>
      <a class="pill pill-about" href="/about/">About</a>
    </nav>

    <div class="statement">
      <h1 class="headline">AI happening to you → <em>AI working for you.</em></h1>
      <p class="home-note">Build 52: one agent a week, by <a href="/about/">Ahmad Iqbal</a>. Free AI agents to make your life easier. No code needed.</p>
    </div>
  </main>

  <script>
    // Each object goes with a pill: phone = About, owl = Agents, cheetah = Tutorials.
    // Hovering an object lights up its pill; clicking (or tapping) it opens that page.
    (function () {
      document.querySelectorAll(".obj[data-link]").forEach(function (obj) {
        var pill = document.querySelector(".pill-" + obj.dataset.link);
        if (!pill) return;
        obj.addEventListener("mouseenter", function () { pill.classList.add("is-active"); });
        obj.addEventListener("mouseleave", function () { pill.classList.remove("is-active"); });
        obj.addEventListener("click", function () { window.location.href = pill.href; });
      });
    })();

    // Tell the layout how tall the headline block is, so nothing sits on it.
    (function () {
      var poster = document.querySelector(".poster");
      var statement = document.querySelector(".statement");
      if (!poster || !statement || !("ResizeObserver" in window)) return;
      function measure() {
        var clear = poster.getBoundingClientRect().bottom - statement.getBoundingClientRect().top;
        poster.style.setProperty("--statement-clear", Math.ceil(clear) + "px");
      }
      new ResizeObserver(measure).observe(statement);
      window.addEventListener("resize", measure);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
      measure();
    })();
  </script>
</body>
</html>
